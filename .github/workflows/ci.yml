name: CI

on:
  push:
    branches:
      - master
      - fix-and-improve
      - fix-and-improve-v2
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', symfony: '^4' }
          - { php: '7.4', symfony: '^5' }
          - { php: '8.0', symfony: '^5' }
          - { php: '8.0', symfony: '^6' }
          - { php: '8.1', symfony: '^5' }
          - { php: '8.1', symfony: '^6' }
          - { php: '8.2', symfony: '^6' }
          - { php: '8.2', symfony: '^7' }
          - { php: '8.3', symfony: '^7' }
          - { php: '8.4', symfony: '^7' }
          - { php: '8.4', symfony: '^8' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin symfony/console to ${{ matrix.symfony }}
        run: composer require --no-update "symfony/console:${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PHP 8.3 resolves symfony/console 7.x (8.x requires PHP 8.4); PHPStan 1.12
      # analyses that cleanly. On PHP 8.4 + symfony/console 8 PHPStan 1.12 cannot
      # parse the vendor sources.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
